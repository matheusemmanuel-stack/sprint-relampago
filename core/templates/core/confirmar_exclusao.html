
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
        }

        p {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button,
        .cancelar {
            display: inline-block;
            padding: 11px 15px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            background-color: #c0392b;
            color: white;
        }

        button:hover {
            background-color: #a93226;
        }

        .cancelar {
            background-color: #e5e7eb;
            color: #333;
        }

        .cancelar:hover {
            background-color: #d1d5db;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Confirmar Exclusão</h1>

        <p>
            Tem certeza de que deseja excluir o projeto
            <strong>{{ projeto.nome }}</strong>?
            Essa ação não poderá ser desfeita.
        </p>

        <div class="acoes">
            <form method="post">
                {% csrf_token %}
                <button type="submit">Sim, excluir</button>
            </form>

            <a
                class="cancelar"
                href="{% url 'listar_e_criar_projetos' %}"
            >
                Cancelar
            </a>
        </div>
    </main>
</body>
</html>
