
{% extends 'core/base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<section class="card">
    <h2>Confirmar Exclusão</h2>

    <p>
        Tem certeza de que deseja excluir o projeto
        <strong>{{ projeto.nome }}</strong>?
    </p>

    <p>Essa ação não poderá ser desfeita.</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit"
                style="background-color: #c0392b;">
            Sim, Excluir
        </button>

        <a class="cancelar"
           href="{% url 'listar_e_criar_projetos' %}">
            Cancelar
        </a>
    </form>
</section>
{% endblock %}
