
{% extends 'core/base.html' %}

{% block title %}Confirmar Exclusão de Tarefa{% endblock %}

{% block content %}
<section class="card">
    <h2>Confirmar Exclusão</h2>

    <p>
        Tem certeza de que deseja excluir a tarefa
        <strong>{{ tarefa.titulo }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="botao-excluir">
            Sim, Excluir
        </button>

        <a class="cancelar"
           href="{% url 'listar_e_criar_tarefas' %}">
            Cancelar
        </a>
    </form>
</section>
{% endblock %}
